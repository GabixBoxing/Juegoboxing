{color:"#1a4a7a",

{color:"#1a6b3c",
es:{name:"Alto con Jab Largo",desc:"Controla la distancia con jab largo — previene la entrada — domina desde lejos",problem:"Si respetas su distancia dominan toda la pelea sin que puedas alcanzarlos",tell:"El peso se mueve hacia atrás antes de tirar el jab — listo para escapar",planA:"Esquivar el jab (cabeza afuera) + cerrar distancia en el mismo movimiento + combinación adentro donde la ventaja de altura desaparece + salida lateral",planB:"Propio jab para medir + falsa entrada + cerrar cuando reacciona al amago",pts:["No respetar su distancia — cerrar activamente — adentro desaparece la ventaja de altura","Esquivar el jab — cabeza afuera — nunca absorber recto","Salida lateral después de la combinación — no quedarse donde puede usar el jab"],r1:"Medir el jab — ver velocidad y timing — preparar el esquive",r2:"Esquivar + cerrar — si funciona — pierde su arma principal",r3:"Si cerramos bien — se frustra — más presión adentro"},

function generarSemanaPro(faseId, semana) {
  const enfasis = {
    1: { pais: "🇨🇺", nombre: "CUBA", enfoque: "Técnica y sombra", bloques: ["Cuerda 20-25min", "Sombra Sagarra 15-20min", "Saco técnico 4x3min"] },
    2: { pais: "🇺🇸", nombre: "EE.UU.", enfoque: "Potencia y sparring", bloques: ["Carrera 25-30min", "Sparring condicionado 4x3min", "Saco potencia 5x3min"] },
    3: { pais: "🇲🇽", nombre: "MÉXICO", enfoque: "Cuerpo y presión", bloques: ["Golpeo al cuerpo 20min", "Clinch defensivo 15min", "Acorralar en esquina 4x2min"] },
    4: { pais: "🌎", nombre: "INTEGRACIÓN", enfoque: "Combinación de los 3", bloques: ["Sombra + Cuerpo 20min", "Sparring + Presión 5x3min", "Evaluación táctica 15min"] },
    5: { pais: "🔥", nombre: "PREP PRO", enfoque: "Afilado estratégico", bloques: ["Plan de pelea 15min", "Situaciones críticas 20min", "Sparring específico 6x3min"] },
    6: { pais: "👑", nombre: "PEAK", enfoque: "Ritmo de combate", bloques: ["Activación 15min", "Visualización 10min", "Debut (sparring real) 4x4min"] }
  };
  const e = enfasis[faseId] || enfasis[1];
  const intensidad = Math.min(0.6 + (semana * 0.04), 1.0);
  const minutos = (base) => Math.floor(base * (0.8 + semana * 0.02));
  const dias = {
    LUN: { title: `${e.pais} ${e.enfoque} - DÍA 1 (Técnica)`, blocks: [`🔥 ${e.bloques[0]} (${minutos(25)}min)`, `🏋️ Físico ${minutos(15)}min`, `🧘 Estiramiento 10min`] },
    MAR: { title: `${e.pais} ${e.enfoque} - DÍA 2 (Aplicación)`, blocks: [`💥 ${e.bloques[1]} (${minutos(20)}min)`, `📋 Escuela de combate ${minutos(20)}min`, `🏋️ Físico ${minutos(12)}min`] },
    JUE: { title: `${e.pais} ${e.enfoque} - DÍA 3 (Combate)`, blocks: [`🥊 ${e.bloques[2]} (${minutos(22)}min)`, `👊 Sombra evaluada ${minutos(15)}min`, `🏋️ Físico ${minutos(15)}min`] },
    VIE: { title: `🌎 EVALUACIÓN SEMANAL`, blocks: [`⚡ Tramos 8x50m`, `📊 Shadow libre 18min`, `📝 Análisis con coach 15min`, `🧘 Estiramiento profundo 12min`] }
  };
  return dias;
}
function renderProWeeklyPlan() {
  if (!ST.proUser || ST.proUser.isCoachPro) return "<div class='card'>Acceso solo para atletas PRO</div>";
  const fase = ST.proUser.proPhase || 1;
  const semana = ST.proUser.proWeek || 1;
  const diasPlan = generarSemanaPro(fase, semana);
  let progreso = JSON.parse(localStorage.getItem(`pro_progress_${ST.proUser.id}`)) || { completados: [] };
  let html = `<div class="card" style="margin-bottom:16px; background:#0a1628;">
    <div style="font-size:20px; font-weight:900; color:#D4A017;">📅 SEMANA ${semana} · FASE ${fase}</div>
    <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
      <span style="background:#1e3050; padding:4px 12px; border-radius:20px;">🇨🇺 CUBA: técnica/sombra</span>
      <span style="background:#1e3050; padding:4px 12px; border-radius:20px;">🇺🇸 USA: potencia/sparring</span>
      <span style="background:#1e3050; padding:4px 12px; border-radius:20px;">🇲🇽 MÉXICO: cuerpo/presión</span>
    </div>
    <div style="margin-top:8px; font-size:12px; color:#D4A017;">✅ 4 días a la semana (LUN, MAR, JUE, VIE)</div>
  </div>`;
  for (let [dia, contenido] of Object.entries(diasPlan)) {
    let completado = progreso.completados.includes(dia);
    html += `<div class="card" style="margin-bottom:12px; border-left:4px solid ${completado ? '#27ae60' : '#D4A017'};">
      <div style="font-weight:800; font-size:20px;">${dia} · ${contenido.title}</div>
      <ul style="margin-top:8px; list-style:none; padding-left:0;">`;
    contenido.blocks.forEach(bloque => {
      html += `<li style="padding:5px 0; border-bottom:1px solid #1e3050;">🥊 ${bloque}</li>`;
    });
    html += `</ul><button class="btn btn-gr" style="margin-top:8px; padding:6px;" onclick="marcarEntrenoPro('${dia}')">${completado ? '✅ COMPLETADO' : '○ MARCAR COMO HECHO'}</button>
    </div>`;
  }
  html += `<div class="card" style="background:linear-gradient(135deg,#1a1a2e,#0a0a18); margin-top:12px;">
    <div style="font-size:18px; font-weight:900; color:#D4A017;">🌎 METODOLOGÍA INTEGRADA (CUB · USA · MEX)</div>
    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;">
      <div style="flex:1; background:#0a1628; border-radius:16px; padding:12px;"><div style="color:#e74c3c; font-weight:800;">🇨🇺 CUBA</div><div style="font-size:12px;">Técnica depurada, sombra constante, movimiento lateral, creatividad en el ring. Énfasis en cuerda y trabajo de pies.</div></div>
      <div style="flex:1; background:#0a1628; border-radius:16px; padding:12px;"><div style="color:#3b82f6; font-weight:800;">🇺🇸 USA</div><div style="font-size:12px;">Sparring condicionado, rondas largas (4 min), potencia y fuerza explosiva. Entrenamiento de alta intensidad.</div></div>
      <div style="flex:1; background:#0a1628; border-radius:16px; padding:12px;"><div style="color:#f59e0b; font-weight:800;">🇲🇽 MÉXICO</div><div style="font-size:12px;">Golpeo al cuerpo, presión constante, trabajo de esquina, "echar pa'delante". Resistencia y castigo al torso.</div></div>
    </div>
    <div style="font-size:10px; color:#7a9ab5; margin-top:12px; text-align:center;">Basado en periodización deportiva (Bompa, Issurin) y boxeo de élite mundial.</div>
  </div>`;
  return html;
}
function marcarEntrenoPro(dia) {
  if (!ST.proUser) return;
  let progreso = JSON.parse(localStorage.getItem(`pro_progress_${ST.proUser.id}`)) || { completados: [] };
  if (!progreso.completados.includes(dia)) {
    progreso.completados.push(dia);
    localStorage.setItem(`pro_progress_${ST.proUser.id}`, JSON.stringify(progreso));
    alert(`✅ ¡Entrenamiento del ${dia} completado! Sigue así, campeón.`);
  } else {
    alert(`⚠️ Ya marcaste el ${dia} como completado.`);
  }
  // Actualizar la vista
  const container = document.getElementById("proContent");
  if (container) container.innerHTML = renderProWeeklyPlan();
}

        <div style="background:#8b1a1a; border-radius:8px; padding:6px 12px;"><div style="font-size:20px; font-weight:900;">${ath.wins||0}V</div><div>${ath.losses||0}D ${ath.draws||0}E</div></div>
      </div>
      <div style="background:#0a1628; border-radius:8px; padding:10px; margin-top:10px;">
        <div style="font-size:10px; color:#e74c3c;">FASE ${fase} · SEMANA ${semana}</div>
        <div style="font-size:12px;">⚡ 4 días de entrenamiento (LUN, MAR, JUE, VIE)</div>
      </div>
    </div>
    <div style="display:flex; gap:6px; background:#0a1628; border-radius:40px; padding:6px; margin-bottom:16px;">
      <button onclick="setProTab('semana')" style="flex:1; background:${subTab==='semana'?'#D4A017':'#1e3050'}; color:${subTab==='semana'?'#070d1a':'#fff'}; border:none; border-radius:30px; padding:8px;">📅 SEMANA</button>
      <button onclick="setProTab('fisico')" style="flex:1; background:${subTab==='fisico'?'#D4A017':'#1e3050'}; color:${subTab==='fisico'?'#070d1a':'#fff'}; border:none; border-radius:30px; padding:8px;">💪 FÍSICO</button>
      <button onclick="setProTab('tactica')" style="flex:1; background:${subTab==='tactica'?'#D4A017':'#1e3050'}; color:${subTab==='tactica'?'#070d1a':'#fff'}; border:none; border-radius:30px; padding:8px;">🎯 TÁCTICA</button>
      <button onclick="setProTab('nutricion')" style="flex:1; background:${subTab==='nutricion'?'#D4A017':'#1e3050'}; color:${subTab==='nutricion'?'#070d1a':'#fff'}; border:none; border-radius:30px; padding:8px;">🥗 NUTRICIÓN</button>
    </div>
    <div id="proContent">${contenido}</div>
    <button onclick="showSwitchModal()" style="width:100%; background:none; border:2px solid #8b1a1a; color:#e74c3c; border-radius:10px; padding:12px; margin-top:20px;">⇄ CAMBIAR DE USUARIO</button>
  `;
  return html;
}
