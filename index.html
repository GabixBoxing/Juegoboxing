.prog-fill{height:100%;background:#D4A017;border-radius:4px}
.frow{display:flex;gap:8px;margin-bottom:10px}
.fcol{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}

.pin-btn:active{background:#D4A017;color:#070d1a}
.style-card{border-left:4px solid;margin-bottom:8px}
.style-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer}
.style-body{padding:0 14px 12px;display:none}
.style-body.on{display:block}
.note-area{width:100%;background:#0a1628;border:1px solid #1e3050;border-radius:8px;padding:10px;color:#fff;resize:none;font-family:'Barlow',sans-serif;font-size:13px;margin-top:6px}
.msg-bubble{border-radius:10px;padding:10px 12px;margin-bottom:8px;max-width:90%}

function badge(ph,wk,sm){const c=PC[ph]||PC[1];const p=t().pn(ph),w=t().wn(wk);const pad=sm?"2px 8px":"4px 10px";const fs=sm?11:13;return`<div style="display:inline-flex;align-items:center;gap:4px;background:${c};border-radius:6px;padding:${pad}"><span style="font-size:${fs}px;color:#fff">${esc(p)}</span><span style="font-size:${sm?10:12}px;color:rgba(255,255,255,.7)">${esc(w)}</span></div>`;}

  if (!progreso.completados.includes(dia)) {
    progreso.completados.push(dia);
    localStorage.setItem(`pro_progress_${ST.proUser.id}`, JSON.stringify(progreso));

  } else {

  if (container) container.innerHTML = renderProWeeklyPlan();

let _pinBuf="",_pinMode="",_pinAthId="";
const COACH_PIN_KEY="cba_coach_pin";
function showLogin(){ const tl=t(); const app=document.getElementById("app"); const shell=document.getElementById("main-shell"); app.style.display="block";shell.style.display="none"; app.innerHTML=`<div style="min-height:100vh;background:#070d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">${logoSVG(100)}<div style="font-weight:900;font-size:26px;letter-spacing:3px;color:#fff;margin-top:16px">CUBAN BOXING</div><div style="font-size:13px;color:#D4A017;letter-spacing:2px;font-weight:700;margin-bottom:30px">OSVIMER COACH</div><div style="width:100%;max-width:340px"><div class="g2" style="margin-bottom:20px"><button onclick="startLogin('coach')" class="btn btn-g" style="padding:15px;font-size:14px">${tl.coachMode}</button><button onclick="startLogin('athlete')" class="btn btn-d" style="padding:15px;font-size:14px">${tl.athMode}</button></div><button onclick="startLogin('pro')" style="width:100%;background:linear-gradient(135deg,#8b1a1a,#5b0000);border:2px solid #e74c3c;color:#fff;border-radius:10px;padding:15px;font-weight:800;font-size:14px;margin-bottom:8px">🥊 SOY ATLETA PRO</button><div style="text-align:center;margin-bottom:10px"><button onclick="toggleLang()" style="background:none;border:1px solid #D4A017;color:#D4A017;border-radius:20px;padding:8px 20px;font-weight:800;font-size:13px;letter-spacing:1px">${ST.lang==="es"?"🇺🇸 ENGLISH":"🇪🇸 ESPAÑOL"}</button></div><div style="text-align:center;font-size:10px;color:#4a6a8a;font-family:Barlow">${L("Basado en Metodología Sagarra — 30+ años","Based on Sagarra Methodology — 30+ years")}</div></div></div>`; }
function startLogin(mode){ const tl=t(); const app=document.getElementById("app"); _pinBuf="";_pinMode=mode;_pinAthId=""; let content=""; if(mode==="athlete"){ content=`<div style="margin-bottom:16px"><label class="lbl" style="text-align:center;display:block;font-size:14px">${tl.selectAth}</label><select class="inp" id="ath-sel" style="border-color:#D4A017;font-size:16px">${ST.athletes.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div>`; } if(mode==="pro"){ content=`<div style="margin-bottom:16px;text-align:center"><div style="font-size:13px;font-weight:900;color:#e74c3c;margin-bottom:4px">🥊 ACCESO PRO</div><div style="font-size:11px;color:#7a9ab5;font-family:Barlow">PIN de acceso PRO: 9001 (coach) o PIN individual</div></div>`; } content+=`<div style="font-size:14px;color:#7a9ab5;text-align:center;margin-bottom:8px;font-family:Barlow">${mode==="coach"?tl.enterCoachPin:tl.enterPin}</div><div class="pin-box" id="pin-display">${[0,1,2,3].map(()=>`<div class="pin-dot"></div>`).join("")}</div><div class="pin-num-grid">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>`<button class="pin-btn" onclick="pinInput('${n}')">${n}</button>`).join("")}</div><div id="pin-err" style="text-align:center;color:#c0392b;font-size:13px;margin-top:8px;height:20px"></div><button onclick="showLogin()" style="width:100%;background:none;border:none;color:#7a9ab5;margin-top:16px;font-size:13px;font-family:Barlow;cursor:pointer">← ${L("Volver","Back")}</button>`; app.innerHTML=`<div style="min-height:100vh;background:#070d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">${logoSVG(70)}<div style="font-weight:900;font-size:20px;color:#fff;margin:12px 0 24px;letter-spacing:2px">${mode==="coach"?tl.coachMode:mode==="pro"?"MODO PRO":tl.athMode}</div><div style="width:100%;max-width:320px">${content}</div></div>`; }
function pinInput(v){ if(v==="")return; if(v==="⌫"){_pinBuf=_pinBuf.slice(0,-1);}else if(_pinBuf.length<4){_pinBuf+=String(v);} const dots=document.querySelectorAll(".pin-dot"); dots.forEach((d,i)=>d.classList.toggle("filled",i<_pinBuf.length)); if(_pinBuf.length===4)setTimeout(checkPin,150); }
function checkPin(){ const tl=t(); const err=document.getElementById("pin-err"); if(_pinMode==="coach"){ const coachPin=ld(COACH_PIN_KEY,"1967"); if(_pinBuf===coachPin){loginCoach();}else{if(err)err.textContent=tl.wrongPin;_pinBuf="";document.querySelectorAll(".pin-dot").forEach(d=>d.classList.remove("filled"));} } else if(_pinMode==="pro"){ const PRO_ACCESS="9001"; if(_pinBuf===PRO_ACCESS){loginProCoach();}else{ const proAth=(ST.proAthletes||[]).find(a=>_pinBuf===(a.pin||"")); if(proAth){loginProAthlete(proAth);}else{if(err)err.textContent=L("PIN incorrecto","Wrong PIN");_pinBuf="";document.querySelectorAll(".pin-dot").forEach(d=>d.classList.remove("filled"));} } } else { const athSel=document.getElementById("ath-sel"); const athId=athSel?athSel.value:ST.athletes[0]?.id; const ath=ST.athletes.find(a=>a.id===athId); if(ath&&_pinBuf===(ath.pin||"1234")){loginAthlete(ath);}else{if(err)err.textContent=tl.wrongPin;_pinBuf="";document.querySelectorAll(".pin-dot").forEach(d=>d.classList.remove("filled"));} } }
function loginCoach(){ ST.isCoach=true; ST.user=null; sv("cba_session",{isCoach:true,userId:null}); launchApp(); }
function loginProCoach(){ ST.isCoach=false; ST.user=null; ST.proUser={id:"coach_pro",name:"Coach Pro",isCoachPro:true}; launchApp(); }
function loginProAthlete(ath){ ST.isCoach=false; ST.user=null; ST.proUser=ath; const savedProg = ld(`cba_pro_progress_${ath.id}`,{}); ST.proProgress = savedProg; launchApp(); }
function loginAthlete(ath){ ST.isCoach=false; ST.user=ath; sv("cba_session",{isCoach:false,userId:ath.id}); launchApp(); }
function launchApp(){ const app=document.getElementById("app"); const shell=document.getElementById("main-shell"); app.style.display="none"; shell.style.display="block"; injectLogo(); updateHdr(); goTab("home"); }
function showSwitchModal(){ const who=ST.isCoach?"COACH":ST.proUser?"PRO: "+ST.proUser.name.split(" ")[0]:(ST.user?ST.user.name.split(" ")[0]:""); document.getElementById("modal-wrap").innerHTML=mwrap(`<div style="text-align:center"><div style="font-size:36px;margin-bottom:12px">⇄</div><div style="font-size:18px;font-weight:900;color:#e74c3c;margin-bottom:6px">${L("CAMBIAR USUARIO","SWITCH USER")}</div><div style="font-size:13px;color:#7a9ab5;font-family:Barlow;margin-bottom:20px">${L("Sesión:","Session:")} <span style="color:#D4A017;font-weight:700">${esc(who)}</span></div><div style="display:flex;flex-direction:column;gap:10px"><button onclick="logout()" class="btn btn-r">${L("🔓 SALIR Y CAMBIAR","🔓 EXIT & SWITCH")}</button><button onclick="closeM()" class="btn btn-d">${L("← CANCELAR","← CANCEL")}</button></div></div>`); }
function logout(){ sv("cba_session",null); ST.user=null; ST.proUser=null; ST.isCoach=false; showLogin(); }
function logoSVG(sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="border-radius:${sz*.18}px;overflow:hidden"><defs><clipPath id="rnd"><rect width="512" height="512" rx="90"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1f3c"/><stop offset="100%" stop-color="#060e1c"/></linearGradient><linearGradient id="gld" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#c48b00"/></linearGradient></defs><rect width="512" height="512" rx="90" fill="url(#bg)"/><g clip-path="url(#rnd)" opacity="0.3"><rect y="0" width="512" height="103" fill="#1356A2"/><rect y="103" width="512" height="103" fill="#fff"/><rect y="206" width="512" height="100" fill="#1356A2"/><rect y="306" width="512" height="103" fill="#fff"/><rect y="409" width="512" height="103" fill="#1356A2"/></g><polygon points="0,0 0,512 215,256" fill="#CF142B" clip-path="url(#rnd)" opacity="0.95"/><polygon points="73,214 83,242.2 112.9,243 89.2,261.3 97.7,290 73,273 48.3,290 56.8,261.3 33.1,243 63,242.2" fill="#fff"/><rect x="200" y="0" width="312" height="512" fill="rgba(5,12,25,0.5)" clip-path="url(#rnd)"/><rect x="210" y="125" width="260" height="3" rx="1.5" fill="url(#gld)" opacity="0.8"/><text x="342" y="295" font-family="'Arial Black',Impact,sans-serif" font-size="168" font-weight="900" fill="url(#gld)" text-anchor="middle" letter-spacing="-4">CBA</text><text x="342" y="338" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="5">CUBAN BOXING</text><text x="342" y="370" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#D4A017" text-anchor="middle" letter-spacing="6" opacity="0.9">OSVIMER COACH</text><rect x="210" y="385" width="260" height="3" rx="1.5" fill="url(#gld)" opacity="0.8"/><rect width="512" height="512" rx="90" fill="none" stroke="rgba(212,160,23,0.3)" stroke-width="5"/></svg>`; }
function injectLogo(){ const el=document.getElementById("hdr-logo"); if(el) el.innerHTML=logoSVG(42); }
function init(){ ST.athletes = ld("cba_athletes", DA); ST.fights = ld("cba_fights", DF); ST.lang = ld("cba_lang", "es"); ST.proAthletes = ld("cba_pro_athletes", []); const sess = ld("cba_session", null); if(sess && sess.isCoach){ ST.isCoach=true; launchApp(); } else if(sess && sess.userId){ const ath = ST.athletes.find(a=>a.id===sess.userId); if(ath) loginAthlete(ath); else showLogin(); } else showLogin(); }
window.addEventListener("DOMContentLoaded", init);
} catch(e) { window.onerror(e.message,'runtime',0,0,e); }
</script>
</body>
</html>
